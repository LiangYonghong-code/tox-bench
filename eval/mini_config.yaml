# mini-swe-agent 的配置覆盖（会被递归合并到 minisweagent/config/default.yaml 之上）
#
# 设计原则：**尽量少覆盖**。
# 这里刻意不覆盖 agent.system_template / agent.instance_template —— 上游默认模板里带着
# bash heredoc、sed、nl 的用法示例，那些示例直接影响"模型能不能把交付文件写对"。
# 换掉模板会让测出来的分数变成"模型熟不熟这套 prompt"，而不是"模型的毒理判定能力"。
# 事实性约定（交付物路径、结束命令）以 harness_note 的形式追加在题面之后，
# 见 eval/phase2_agent.py 的 load_config()。

environment:
  # 单条容器命令超时。上游默认 30s，跑 pandas/scipy 脚本不够。
  timeout: 300
  # 容器最长存活时间。与 task.toml 的 [phases].agent_timeout_sec（7200 = 2h）对齐；
  # 改这里就要同步改 task.toml，否则 agent 的墙钟上限与容器存活时间会打架。
  container_timeout: "2h"

# 追加到题面之后的事实性约定（由 eval/phase2_agent.py 读取，不会传给 mini 的构造函数）。
harness_note: |
  ---

  ## 本次运行的交付约定（harness 约定，与题面同等强制）

  - 你在一个 Linux 容器内工作，工作目录是 `{workdir}`。
  - 题面要求的所有交付物必须写到题面给出的**绝对路径**，缺任何一个都判为失败。
  - 判分器只读取文件内容，不会替你补字段、也不会容错解析：格式必须严格符合题面 schema。
  - 不要修改题面中声明为不可修改的文件。
  - 自查完成后，用**单独的一条命令**结束本次运行：

  ```mswea_bash_command
  echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
  ```
